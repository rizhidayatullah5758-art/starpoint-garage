<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>Reset Password Staff | Starpoint Garage</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#090909;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{width:min(100%,440px);background:#131313;border:1px solid #303030;border-radius:22px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
    .logo{display:block;width:170px;max-width:60%;margin:0 auto 20px}.eyebrow{text-align:center;color:#777;text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:800}
    h1{text-align:center;font-size:28px;line-height:1.1;margin:9px 0 10px}p{text-align:center;color:#999;line-height:1.6;margin:0 0 22px}
    label{display:block;color:#c7c7c7;font-size:12px;margin:13px 0 6px}input{width:100%;background:#0a0a0a;color:#fff;border:1px solid #363636;border-radius:11px;padding:13px 14px;font-size:16px;outline:none}
    input:focus{border-color:#777}.btn{width:100%;border:0;border-radius:12px;padding:13px 15px;background:#fff;color:#000;font-weight:900;margin-top:17px;cursor:pointer}.btn:disabled{opacity:.5}
    .msg{display:none;margin-top:14px;border-radius:11px;padding:11px 13px;font-size:12px}.msg.show{display:block}.msg.error{background:#2a1111;color:#ffb4b4}.msg.ok{background:#102219;color:#baf0cb}
    .back{display:block;text-align:center;color:#aaa;font-size:13px;margin-top:17px}
  </style>
</head>
<body>
  <main class="card">
    <img src="IMG_0461.png" alt="Starpoint Garage" class="logo">
    <div class="eyebrow">Staff Access</div>
    <h1>Buat Password Baru</h1>
    <p>Gunakan link recovery yang dikirim ke email staff Starpoint Garage.</p>
    <form id="form">
      <label for="password">Password baru</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimal 8 karakter">
      <label for="confirm">Ulangi password</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Ulangi password">
      <button class="btn" id="submit" type="submit">Simpan Password</button>
    </form>
    <div class="msg" id="message"></div>
    <a class="back" href="./staff.html">Kembali ke login staff</a>
  </main>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const supabase=createClient("https://lscwmlxsvmakhnzknvrr.supabase.co","sb_publishable_xP2C7pPrFpjzbo4WS-C2sw_pYi5hHph");
    const message=document.getElementById("message");
    function show(text,type="error"){message.textContent=text;message.className="msg show "+type}
    async function init(){
      const code=new URLSearchParams(location.search).get("code");
      if(code){const {error}=await supabase.auth.exchangeCodeForSession(code);if(error)show("Link reset tidak valid atau sudah kedaluwarsa.")}
      const {data}=await supabase.auth.getSession();
      if(!data.session)show("Sesi reset belum tersedia. Minta link reset baru dari halaman staff.");
    }
    document.getElementById("form").addEventListener("submit",async e=>{
      e.preventDefault();
      const p=document.getElementById("password").value,c=document.getElementById("confirm").value,btn=document.getElementById("submit");
      if(p.length<8||!/[A-Za-z]/.test(p)||!/\d/.test(p))return show("Password minimal 8 karakter dan mengandung huruf serta angka.");
      if(p!==c)return show("Konfirmasi password belum sama.");
      btn.disabled=true;btn.textContent="Menyimpan...";
      const {error}=await supabase.auth.updateUser({password:p});
      if(error){btn.disabled=false;btn.textContent="Simpan Password";return show("Password belum dapat diubah. Minta link reset baru.")}
      show("Password berhasil diubah. Kamu akan kembali ke login staff.","ok");
      await supabase.auth.signOut();
      setTimeout(()=>location.href="./staff.html?reset=success",800);
    });
    init();
  </script>
</body>
</html>
