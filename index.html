<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Starpoint Garage</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      line-height: 1.6;
    }

    header {
      background: #111;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #333;
    }

    header h1 {
      font-size: 28px;
      letter-spacing: 2px;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: #ccc;
      text-decoration: none;
      margin: 0 10px;
      font-size: 14px;
    }

    nav a:hover {
      color: white;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background:
        linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.8));
    }

    .hero h2 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #bbb;
      max-width: 600px;
      margin: auto;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 13px 25px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    section {
      padding: 60px 20px;
      max-width: 1000px;
      margin: auto;
    }

    section h2 {
      text-align: center;
      margin-bottom: 35px;
      font-size: 30px;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #151515;
      border: 1px solid #292929;
      padding: 25px;
      border-radius: 10px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      color: #aaa;
      font-size: 14px;
    }

    .contact {
      text-align: center;
      background: #111;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      padding: 25
