<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <title>Reset Password | Starpoint Garage</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0b0b;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{width:min(100%,440px);background:#151515;border:1px solid #2c2c2c;border-radius:20px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .logo{display:block;width:180px;max-width:60%;margin:0 auto 22px}.eyebrow{color:#aaa;text-transform:uppercase;letter-spacing:.12em;font-size:12px;text-align:center}
    h1{font-size:28px;line-height:1.15;text-align:center;margin:8px 0 10px}p{color:#aaa;line-height:1.6;text-align:center;margin:0 0 24px}
    label{display:block;font-size:13px;color:#c8c8c8;margin:14px 0 7px}input{width:100%;border:1px solid #383838;background:#0f0f0f;color:#fff;border-radius:12px;padding:14px 15px;font-size:16px;outline:none}
    input:focus{border-color:#777}.btn{width:100%;margin-top:18px;border:0;border-radius:12px;padding:14px 16px;background:#fff;color:#000;font-size:15px;font-weight:800;cursor:pointer}
    .btn:disabled{opacity:.55;cursor:not-allowed}.msg{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.5;text-align:left}
    .msg.show{display:block}.msg.error{background:#2a1111;color:#ffb5b5}.msg.ok{background:#10251a;color:#b7f5ce}.back{display:block;text-align:center;margin-top:18px;color:#bbb;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <img src="IMG_0461.png" alt="Starpoint Garage" class="logo">
    <div class="eyebrow">Member Starpoint</div>
    <h1>Buat Password Baru</h1>
    <p>Masukkan password baru untuk akun member kamu.</p>

    <form id="resetForm">
      <label for="password">Password baru</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimal 8 karakter">

      <label for="confirmPassword">Ulangi password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Ulangi password baru">

      <button id="submitBtn" class="btn" type="submit">Simpan Password Baru</button>
    </form>

    <div id="message" class="msg"></div>
    <a class="back" href="./">Kembali ke Starpoint Garage</a>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://msvdxyicostwztisvbvl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ihIG0dcPUHF9egWHaRlfvQ_E_Bn8zBk";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("resetForm");
    const button = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    function show(text, type="error") {
      message.textContent = text;
      message.className = "msg show " + type;
    }

    async function ensureRecoverySession() {
      const code = new URLSearchParams(location.search).get("code");
      if (code) {
        const { error } = await supabase.auth.exchangeCodeForSession(code);
        if (error) show("Link reset tidak valid atau sudah kedaluwarsa.");
      }

      const { data } = await supabase.auth.getSession();
      if (!data.session) {
        setTimeout(() => {
          supabase.auth.getSession().then(({data}) => {
            if (!data.session) show("Sesi reset tidak ditemukan. Minta link reset baru dari halaman login.");
          });
        }, 600);
      }
    }

    supabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        show("Link valid. Silakan buat password baru.", "ok");
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirmation = document.getElementById("confirmPassword").value;

      if (password.length < 8 || !/[A-Za-z]/.test(password) || !/\d/.test(password)) {
        return show("Password harus minimal 8 karakter dan mengandung huruf serta angka.");
      }
      if (password !== confirmation) return show("Konfirmasi password belum sama.");

      button.disabled = true;
      button.textContent = "Menyimpan...";

      const { error } = await supabase.auth.updateUser({ password });
      if (error) {
        button.disabled = false;
        button.textContent = "Simpan Password Baru";
        return show("Password belum bisa diubah. Minta link reset baru lalu coba lagi.");
      }

      show("Password berhasil diubah. Kamu akan kembali ke halaman login.", "ok");
      await supabase.auth.signOut();
      setTimeout(() => location.href = "./?reset=success", 900);
    });

    ensureRecoverySession();
  </script>
</body>
</html>
