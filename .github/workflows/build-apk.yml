name: Build Starpoint Garage Internal APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build native installable APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk StarpointGarage-Internal-v3.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StarpointGarage-Internal-APK
          path: StarpointGarage-Internal-v3.0.0.apk
          if-no-files-found: error
          retention-days: 30